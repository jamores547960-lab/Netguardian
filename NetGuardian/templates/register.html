{% extends 'base.html' %}

{% block title %}NetGuardian - Create Account{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: 80vh;">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-white border-0 pt-4 pb-2 text-center">
                <div class="d-inline-block mb-3 p-3 rounded-circle" style="background: rgba(27, 59, 111, 0.06);">
                    <svg width="70" height="85" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 8L15 28V60C15 85 50 112 50 112C50 112 85 85 85 60V28L50 8Z" fill="#1b3b6f" stroke="#0e2347" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M50 14L20 32V59C20 80 50 104 50 104C50 104 80 80 80 59V32L50 14Z" fill="none" stroke="#229690" stroke-width="2"/>
                        <circle cx="50" cy="42" r="10" fill="#229690" stroke="#1b3b6f" stroke-width="1.5"/>
                        <path d="M50 36V43" stroke="#1b3b6f" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="50" cy="47" r="1.25" fill="#1b3b6f"/>
                        <path d="M35 62C40 57 60 57 65 62" stroke="#f4b41a" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <path d="M40 70C43 67 57 67 60 70" stroke="#f4b41a" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <circle cx="50" cy="78" r="2.5" fill="#f4b41a"/>
                    </svg>
                </div>
                <h3 class="fw-bold mb-0" style="color: #1b3b6f; letter-spacing: -0.5px;">Create Account</h3>
                <p class="text-uppercase fw-bold mt-1 mb-0" style="font-size: 0.68rem; letter-spacing: 1.2px; color: #229690;">
                    NETGUARDIAN ACCESS
                </p>
            </div>

            <div class="card-body px-4 pt-3 pb-4">
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-semibold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@gmail.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label text-muted small fw-semibold">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="Whitelist Manager">Whitelist Manager</option>
                            <option value="Shift Monitor">Shift Monitor</option>
                        </select>
                    </div>

                    <button type="submit" class="btn w-100 py-2 fw-semibold text-white shadow-sm mt-2" style="background-color: #1b3b6f; border-radius: 8px;">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">Already have an account? Sign in →</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
